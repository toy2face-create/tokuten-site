    .gold-line { height: 2px; background: linear-gradient(90deg, transparent, var(--gold) 30%, var(--gold-lt) 50%, var(--gold) 70%, transparent); }
    .viewer { flex: 1; display: flex; flex-direction: column; }
    iframe { flex: 1; width: 100%; min-height: calc(100vh - 54px); border: none; }
    .sp-note { display: none; flex: 1; padding: 40px 24px; text-align: center; background: var(--cream); flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
