<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>特典③ サバイバルハッカー ｜ たい式オプチャ特典</title>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --navy: #0d1f4e; --gold: #b8892e; --gold-lt: #e8c46a; --cream: #faf7f0; }
    body { font-family: 'Shippori Mincho B1', serif; background: var(--cream); min-height: 100vh; display: flex; flex-direction: column; }
    .top-bar { background: var(--navy); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .top-bar a.back { color: rgba(255,255,255,0.6); font-size: 13px; text-decoration: none; display: flex; align-items: center; gap: 6px; padding: 6px 0; }
    .top-bar a.back:hover { color: var(--gold-lt); }
    .top-bar .title { color: var(--gold-lt); font-size: 13px; font-weight: 700; letter-spacing: 0.06em; flex: 1; text-align: center; }
    .gold-line { height: 2px; background: linear-gradient(90deg, transparent, var(--gold) 30%, var(--gold-lt) 50%, var(--gold) 70%, transparent); }
    .coming { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 24px; text-align: center; gap: 20px; }
    .coming-badge { background: var(--navy); color: var(--gold-lt); font-size: 11px; font-weight: 700; letter-spacing: 0.2em; padding: 6px 20px; border-radius: 20px; }
    .coming h2 { font-size: clamp(18px, 4vw, 26px); font-weight: 800; color: var(--navy); line-height: 1.5; }
    .coming p { font-size: 13px; color: #666; line-height: 1.9; }
    .back-btn { display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; background: var(--navy); color: var(--gold-lt); font-size: 13px; font-weight: 700; padding: 12px 28px; border-radius: 3px; text-decoration: none; letter-spacing: 0.06em; }
    .back-btn:hover { opacity: 0.85; }
    @media (max-width: 640px) { .top-bar .title { display: none; } }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="index.html" class="back">← 特典一覧に戻る</a>
    <span class="title">特典③ ADHD会社員 サバイバルハッカー</span>
  </div>
  <div class="gold-line"></div>
  <div class="coming">
    <span class="coming-badge">COMING SOON</span>
    <h2>ADHD会社員 サバイバルハッカー<br>「生き延びる」から「支配する」へ</h2>
    <p>この特典は現在準備中です。<br>もうしばらくお待ちください。</p>
    <a href="index.html" class="back-btn">← 特典一覧に戻る</a>
  </div>
</body>
</html>
