<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>特典④ ダラダラ撲滅ロードマップ ｜ たい式オプチャ特典</title>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --navy: #0d1f4e; --gold: #b8892e; --gold-lt: #e8c46a; --cream: #faf7f0; }
    body { font-family: 'Shippori Mincho B1', serif; background: var(--cream); min-height: 100vh; display: flex; flex-direction: column; }
    .top-bar { background: var(--navy); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .top-bar a.back { color: rgba(255,255,255,0.6); font-size: 13px; text-decoration: none; display: flex; align-items: center; gap: 6px; }
    .top-bar a.back:hover { color: var(--gold-lt); }
    .top-bar .title { color: var(--gold-lt); font-size: 13px; font-weight: 700; letter-spacing: 0.06em; }
    .dl-btn { background: var(--gold); color: #fff; font-size: 13px; font-weight: 700; padding: 9px 20px; border-radius: 3px; text-decoration: none; letter-spacing: 0.06em; white-space: nowrap; }
    .dl-btn:hover { background: var(--gold-lt); color: var(--navy); }
    .gold-line { height: 2px; background: linear-gradient(90deg, transparent, var(--gold) 30%, var(--gold-lt) 50%, var(--gold) 70%, transparent); }
    .viewer { flex: 1; display: flex; flex-direction: column; }
    iframe { flex: 1; width: 100%; min-height: calc(100vh - 60px); border: none; }
    .sp-note { display: none; padding: 24px 20px; text-align: center; }
    .sp-note p { font-size: 13px; color: #555; line-height: 1.8; margin-bottom: 16px; }
    @media (max-width: 640px) { iframe { display: none; } .sp-note { display: block; } }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="index.html" class="back">← 特典一覧に戻る</a>
    <span class="title">特典④ ダラダラ撲滅ロードマップ</span>
    <a href="tokuten-04.pdf" download class="dl-btn">↓ ダウンロード</a>
  </div>
  <div class="gold-line"></div>
  <div class="viewer">
    <iframe src="tokuten-04.pdf#toolbar=1&navpanes=0" title="特典④ ダラダラ撲滅ロードマップ"></iframe>
    <div class="sp-note">
      <p>スマートフォンではPDFの埋め込み表示に対応していないブラウザがあります。<br>下のボタンからダウンロードしてご確認ください。</p>
      <a href="tokuten-04.pdf" download class="dl-btn">↓ PDFをダウンロード</a>
    </div>
  </div>
</body>
</html>
